version: "3.8"

services:
  opensearch:
    # Pin a specific tag from hub.docker.com/r/opensearchproject/opensearch/tags
    # if you want reproducible builds — "latest" is fine for a hackathon.
    image: opensearchproject/opensearch:latest
    container_name: opensearch-local
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
