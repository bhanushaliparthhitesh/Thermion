    <title>Thermion | Midnight Cooling Instrument</title>
    
    <!-- Fonts -->

    <!-- We'll use JetBrains Mono as a fallback for Berkeley Mono if the user doesn't have it installed -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
      /* Inject font face fallback variables so JetBrains Mono gets used when Berkeley Mono is unavailable */
      :root {
        --font-berkeley-mono: 'Berkeley Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
